<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Login Authentication System</title>
  <meta name="description" content="Create your account to access the protected dashboard. Client-side authentication with Web Crypto SHA-256 hashing.">
  <meta property="og:title" content="Register - Login Authentication System">
  <meta property="og:description" content="Create your account to access the protected dashboard. Client-side authentication with Web Crypto SHA-256 hashing.">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">

  <main class="auth-wrapper" id="main-container">
    <div class="auth-card" id="register-card">
      
      <!-- Card Header -->
      <header class="auth-header" id="auth-header">
        <h1 id="register-heading">Create Your Account ✨</h1>
        <p id="register-subtitle">Join us and get started.</p>
      </header>

      <!-- Alert / Notification Message Box -->
      <div class="alert-box" id="register-alert" role="alert" aria-live="polite">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span class="alert-message-text"></span>
      </div>

      <!-- Registration Form -->
      <form class="auth-form" id="register-form" novalidate>
        
        <!-- Username Field -->
        <div class="form-group" id="group-reg-username">
          <label class="form-label" for="reg-username">Username</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="reg-username" 
              name="username" 
              class="input-field" 
              placeholder="Choose a username"
              autocomplete="username"
              required
            >
          </div>
          <span class="field-error-message" id="error-reg-username"></span>
        </div>

        <!-- Email Field -->
        <div class="form-group" id="group-reg-email">
          <label class="form-label" for="reg-email">Email</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="reg-email" 
              name="email" 
              class="input-field" 
              placeholder="Enter your email"
              autocomplete="email"
              required
            >
          </div>
          <span class="field-error-message" id="error-reg-email"></span>
        </div>

        <!-- Password Field with Visibility Toggle & Strength Indicator -->
        <div class="form-group" id="group-reg-password">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="reg-password" 
              name="password" 
              class="input-field input-with-action" 
              placeholder="Create a password"
              autocomplete="new-password"
              required
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              id="toggle-reg-password" 
              aria-label="Show password"
              title="Toggle password visibility"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error-message" id="error-reg-password"></span>

          <!-- Dynamic Password Strength Indicator -->
          <div class="strength-container" id="password-strength-container" aria-live="polite">
            <div class="strength-header">
              <span class="strength-label">Password strength:</span>
              <span class="strength-value" id="password-strength-value">None</span>
            </div>
            <div class="strength-bars">
              <div class="strength-bar-segment" id="strength-bar-1"></div>
              <div class="strength-bar-segment" id="strength-bar-2"></div>
              <div class="strength-bar-segment" id="strength-bar-3"></div>
            </div>
          </div>
        </div>

        <!-- Confirm Password Field with Visibility Toggle -->
        <div class="form-group" id="group-reg-confirm-password">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="reg-confirm-password" 
              name="confirmPassword" 
              class="input-field input-with-action" 
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              id="toggle-reg-confirm-password" 
              aria-label="Show password"
              title="Toggle password visibility"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error-message" id="error-reg-confirm-password"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block" id="btn-register">
          Create Account
        </button>

      </form>

      <!-- Footer: Link to Login -->
      <footer class="auth-footer" id="register-footer">
        <p>Already have an account? <a href="index.html" class="auth-link" id="link-to-login">Login</a></p>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
